# Conda alternative (recommended on Windows — Pinocchio has no pip wheels for Windows):
#   conda env create -f environment.yml && conda activate sbeg461-labs
name: sbeg461-labs
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pinocchio=4.1
  - numpy
  - scipy
  - matplotlib
  - pip
  - pip:
    - cmake==4.3.4
    - modern_robotics==1.1.1
    - ninja==1.11.1.4
    - pytest==9.1.1
    - sympy==1.14.0
    - toppra==0.6.3
    - -e ./library
